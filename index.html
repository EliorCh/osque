<style>

  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#E8EDEF; --ink:#1C2A30; --ink-2:#4A5A61; --muted:#7A8A90; --line:#D3DCDF;

  --good:#2E7D4F; --good-soft:#DDF1E4; --bad:#B23B3B; --bad-soft:#F8E0DE; --warn:#9A6A00; --warn-soft:#FBEFCF;

  --f-body:'Heebo',system-ui,sans-serif; --f-head:'Rubik','Heebo',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11191C; --surface:#18242A; --sunk:#0E1518; --ink:#E4ECEE; --ink-2:#B3C1C6; --muted:#81939A; --line:#2B3A40;
  --accent:#4FB3BD; --accent-ink:#0B1416; --accent-soft:#1D3A3E;
  --good:#6CCB92; --good-soft:#173627; --bad:#EE8A84; --bad-soft:#3E1D1C; --warn:#E3B54F; --warn-soft:#3A2F12;
  --code-bg:#0A1114; --code-ink:#DCE8EB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11191C; --surface:#18242A; --sunk:#0E1518; --ink:#E4ECEE; --ink-2:#B3C1C6; --muted:#81939A; --line:#2B3A40;
  --accent:#4FB3BD; --accent-ink:#0B1416; --accent-soft:#1D3A3E;
  --good:#6CCB92; --good-soft:#173627; --bad:#EE8A84; --bad-soft:#3E1D1C; --warn:#E3B54F; --warn-soft:#3A2F12;
  --code-bg:#0A1114; --code-ink:#DCE8EB; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.05rem;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.75rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
nav.tabs a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:500;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.3}
h1{font-size:1.5rem;margin:0 0 6px}
h2{font-size:1.15rem;margin:0}
.lede{color:var(--ink-2);margin:0 0 16px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.filters{display:grid;gap:10px;margin-bottom:16px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:.78rem;letter-spacing:.04em;color:var(--muted);min-width:64px;font-weight:500}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 11px;font:inherit;font-size:.88rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.later{border-style:dashed}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);margin-inline-end:auto}
.qcard>*,.part>*,.sol>*,.slot>*{min-width:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.tag{border-radius:6px;padding:1px 8px;background:var(--sunk);color:var(--ink-2)}
.tag.exam{font-family:var(--f-mono);background:var(--ink);color:var(--surface);font-weight:600}
.tag.type{background:var(--accent-soft);color:var(--ink)}

.star[aria-pressed="true"]{color:var(--warn)}
.txt .ln{min-height:.5em}
.txt .gap{height:.6em}
.ltr{unicode-bidi:isolate;direction:ltr}
.m{font-family:var(--f-mono);font-size:.9rem;direction:ltr;text-align:right;unicode-bidi:isolate}
pre.code{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.82rem;line-height:1.5;padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0;white-space:pre}

table.dt{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border:1px solid var(--line);padding:4px 10px;text-align:center}

.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.opt .k{font-family:var(--f-head);font-weight:700;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tf{display:flex;gap:10px;flex-wrap:wrap}
.tf .opt{width:auto;min-width:120px;justify-content:center}
.part{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.plabel{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.sol{border-radius:10px;background:var(--sunk);padding:12px 14px;display:grid;gap:10px;min-width:0}
.tree{overflow-x:auto;direction:ltr;text-align:center;padding:4px 0}
.tree svg{max-width:none;display:inline-block}
.sol h4{margin:0;font-family:var(--f-head);font-size:.9rem;color:var(--ink-2)}
.verdict{font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.note{border-inline-start:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:6px}
.note b{color:var(--warn)}
.check{font-size:.82rem;color:var(--good)}
details.off summary{cursor:pointer;color:var(--ink-2);font-size:.9rem}
details.off .txt{margin-top:6px}
.grade{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.grade .chip[aria-pressed="true"].g1{background:var(--good-soft);border-color:var(--good)}
.grade .chip[aria-pressed="true"].g0{background:var(--bad-soft);border-color:var(--bad)}
.grade .chip[aria-pressed="true"].gh{background:var(--warn-soft);border-color:var(--warn)}
.study{font-size:.85rem}
details.orig summary{cursor:pointer;font-size:.85rem;color:var(--ink-2)}
details.orig img{display:block;margin-top:6px;max-width:min(100%,560px);border:1px solid var(--line);border-radius:6px;background:#fff}
.study a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px}
.list{display:grid;gap:14px}
.exhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--f-head);font-size:1.6rem;font-weight:700}
select,input[type=search]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink);max-width:100%}
.prog{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,11rem) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .g{background:var(--good)} .track .b{background:var(--bad)}
.pnum{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button{font-family:var(--f-mono)}
.exgroup summary{cursor:pointer;font-family:var(--f-head);font-weight:500;padding:8px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){ .prow{grid-template-columns:1fr auto} .prow .track{grid-column:1/-1;order:3} .qcard{padding:14px} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderText(text) {
  if (!text) return '';

  // Normalize inline numbered lists written with parenthesized markers
  // "(1) x (2) y (3) z" or "(1) x, (2) y" mid-sentence: these render badly in
  // RTL (each "(N)" splits and the items reorder visually). If the text has a
  // "(1)" marker followed later by "(2)", put items 2+ on their own line. The
  // "(1)" item stays in place; a blank line before "(1)" is left to the author.
  if (/\(1\)\s/.test(text) && /\(2\)\s/.test(text)) {
    text = text.replace(/[,;]?\s+(\([2-9]\))\s/g, '\n$1 ');
  }

  // We wrap LTR runs (English / numbers / math) in <span class="ltr"> BEFORE
  // escaping, so comparison operators like > and < can live inside a run
  // (e.g. "68 > 63") without the escaped entity (&gt;) being torn apart by the
  // matcher. Each matched run is HTML-escaped inside the replacement; the
  // Hebrew text between runs is escaped separately afterwards.
  const inner = "[A-Za-z0-9_<>\\-+=:;/\\\\.,()\\[\\]{}@#$%^&*'\"`~?!|\u00B7\u00B1\u00D7\u00F7\u00B0\u2030\u0370-\u03FF\u2070-\u209F\u2200-\u22FF\u2190-\u21FF]";
  const start = "[A-Za-z0-9\u0370-\u03FF]";
  const piece = `${start}${inner}*`;
  // A piece bridged across a MATH-OPERATOR gap (e.g. "= (1-β)") may begin with an
  // opening bracket or |, so a formula like
  // "DevRTT = (1-β)·DevRTT + β·|SampleRTT - EstimatedRTT|" stays one LTR run.
  const mathPiece = `[\\(\\[\\{|]?${start}${inner}*|[\\(\\[\\{|]${inner}*`;
  // A piece bridged across a PLAIN SPACE must start with an alphanumeric — this
  // prevents "LAN1 (מארחים...)" from pulling the "(" into the LAN1 run (which
  // then orphans the paren when the Hebrew word breaks the run).
  const plainPiece = piece;
  const mathGap = `[ ]+[=+\\-*/×÷·|<>&\u00B1][ ]+`;
  const spaceGap = `[ ]+`;
  const re = new RegExp(`(${piece}(?:(?:${mathGap}(?:${mathPiece}))|(?:${spaceGap}(?:${plainPiece})))*)`, 'g');

  const PLACEHOLDER = '\u0000';
  const runs = [];
  // Replace each LTR run with a placeholder, remembering its escaped HTML.
  text = text.replace(re, m => {
    // Move trailing punctuation that belongs to the RTL sentence outside the
    // span: sentence-enders (? ! .) and also , : ; — a run ends at an LTR→RTL
    // boundary, so a comma/colon there is the Hebrew sentence's, not the term's
    // (fixes "IPv4," rendering the comma on the wrong side). We keep at most the
    // trailing punctuation run; internal commas (f(x,y), 1,000) are untouched
    // because they're not at the run's end.
    const trailing = m.match(/[?!.,:;]+$/);
    let core = m, tail = '';
    if (trailing) {
      const ltrPart = m.slice(0, m.length - trailing[0].length);
      if (ltrPart && /[A-Za-z0-9\u0370-\u03FF]/.test(ltrPart)) {
        core = ltrPart;
        tail = trailing[0];
      }
    }
    // Don't LTR-wrap a standalone number that sits in Hebrew context (e.g. the
    // "5" in "(5 שכבות)", "4" in "שכבה 4", a year "2023", or "1,000"). Isolating
    // such a number in its own span makes it read awkwardly next to the Hebrew.
    // We DO still wrap numbers that carry LTR structure: IP addresses / version
    // numbers (two or more dot/colon-separated groups), math operators
    // (= < > / * + - · | %), a caret power, or an attached unit letter — those
    // genuinely need left-to-right isolation.
    const isBareNumber = /^[0-9]+(?:[.,][0-9]+)?$/.test(core);
    if (isBareNumber) {
      runs.push(escapeHtml(core) + escapeHtml(tail));
      return PLACEHOLDER + (runs.length - 1) + PLACEHOLDER;
    }
    const pairs = { ')': '(', ']': '[', '}': '{' };
    let moved = '';
    let guard = 0;
    while (guard++ < 8) {
      const last = core[core.length - 1];
      if (pairs[last]) {
        const opener = pairs[last];
        const opens = (core.match(new RegExp('\\' + opener, 'g')) || []).length;
        const closes = (core.match(new RegExp('\\' + last, 'g')) || []).length;
        if (closes > opens) { moved = escapeHtml(last) + moved; core = core.slice(0, -1); continue; }
      }
      break;
    }
    runs.push(`<span class="ltr">${escapeHtml(core)}</span>${moved}${escapeHtml(tail)}`);
    return PLACEHOLDER + (runs.length - 1) + PLACEHOLDER;
  });

  // Escape the Hebrew/other text that sits between the runs.
  text = escapeHtml(text);

  // Restore the runs.
  text = text.replace(new RegExp(PLACEHOLDER + '(\\d+)' + PLACEHOLDER, 'g'), (_, i) => runs[+i]);

  // Bidi anchor: an opening bracket that sits between a closing LTR </span> and
  // Hebrew text (e.g. "Playback Attack (התקפת השמעה חוזרת)") is a bidi-neutral
  // character; the browser may resolve its direction toward the LTR side and
  // render it on the wrong edge. Insert a Right-to-Left Mark (U+200F) before
  // such a bracket so it anchors to the surrounding RTL context. We only touch
  // brackets that are OUTSIDE spans (a run's own "(" is already inside the span).
  text = text.replace(/(<\/span>)(\s*)([(\[{])(\s*[\u0590-\u05FF])/g, '$1$2\u200F$3$4');

  // Auto-break inline numbered lists: a marker like "2)" or "3)" that follows
  // ", " or "; " starts a new line, so "1) ... , 2) ... , 3) ..." stacks
  // vertically instead of running together (which reads badly in RTL). The
  // first item ("1)") is left in place; we only break BEFORE items 2 and on.
  // We require the "N)" to be followed by a space so "(שכבה 4)" is never hit.
  if (/(?:^|[\s>])1\)\s/.test(text)) {
    text = text.replace(/(?:,|;)\s+([2-9]\))\s/g, '\n$1 ');
  }

  // line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

const B = window.BANK;
const STUDY = 'https://eliorch.github.io/ossum/';
const TPAGE = {"intro": "intro.html", "process": "processes.html", "sched": "scheduling.html", "signals": "signals.html", "redir": "redir.html", "memory": "vmem.html"};
const TOPICS = [
  ['intro','מבוא','פרק 1 · מבוא'],['process','תהליכים','פרק 3 · תהליכים'],['sched','תזמון','פרק 4 · תזמון'],
  ['signals','סיגנלים וזומבים','פרק 5 · זומבים וסיגנלים'],['redir','exec, הפניות וצינורות','פרק 6 · הפניות וצינורות'],['memory','זיכרון וירטואלי','פרק 7 · זיכרון וירטואלי'],
  ['threads','חוטים ומנעולים',null],['sync','סנכרון',null],['deadlock','קיפאון',null],['disk','דיסקים, RAID ו-SSD',null],['fs','מערכות קבצים',null]];
const TNAME = Object.fromEntries(TOPICS.map(t=>[t[0],t[1]]));
const TSTUDY = Object.fromEntries(TOPICS.map(t=>[t[0],t[2]]));
const COVERED = TOPICS.filter(t=>t[2]).map(t=>t[0]);
const TYPES = [['tf','נכון / לא נכון'],['mcq','אמריקאית'],['open','פתוחה']];
const TYPENAME = Object.fromEntries(TYPES);
const LETTERS = ['א','ב','ג','ד','ה'];
const KEY = 'os-mta-practice-v1';
const Q = B.questions; const QID = Object.fromEntries(Q.map(q=>[q.id,q]));

/* ---------- state ---------- */
let S = {topics:[...COVERED], types:['tf','mcq','open'], only:'all', results:{}, marked:[], pos:0};
try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S = Object.assign(S,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function record(id, score){ S.results[id] = {s:score, t:Date.now()}; save(); }

/* ---------- text rendering ---------- */
const HEB = /[֐-׿]/;
function isCode(l){ return !HEB.test(l) && (/[;{}]\s*(\/\/.*)?$/.test(l) || /^\s*(#|\/\/)/.test(l) || /^\s{4,}\S/.test(l) || /^\s*\d+\s{1,3}\S.*[;{}(]/.test(l)); }
function rich(text){
  if(!text) return '';
  const out=[];
  for(const block of String(text).split(/\n{2,}/)){
    const lines = block.split('\n');
    const nCode = lines.filter(isCode).length;
    if(lines.length>=2 && nCode>=Math.ceil(lines.length/2) && lines.every(l=>!HEB.test(l) || /\/\//.test(l))){
      out.push('<pre class="code">'+escapeHtml(block)+'</pre>'); continue;
    }
    out.push(lines.map(l=> l.trim()==='' ? '' : HEB.test(l) ? '<div class="ln">'+renderText(l)+'</div>' : '<div class="ln m" dir="ltr">'+escapeHtml(l)+'</div>').join(''));
  }
  return '<div class="txt">'+out.join('<div class="gap"></div>')+'</div>';
}
function code(c){ return c ? '<pre class="code">'+escapeHtml(c)+'</pre>' : ''; }
function table(t){
  if(!t) return '';
  return '<div class="tablewrap"><table class="dt"><thead><tr>'+t.headers.map(h=>'<th>'+renderText(String(h))+'</th>').join('')+'</tr></thead><tbody>'+
    t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+renderText(String(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function esc(s){ return escapeHtml(String(s)).replace(/"/g,'&quot;'); }

/* ---------- filtering ---------- */
function filtered(){
  return Q.filter(q=> S.topics.includes(q.topic) && S.types.includes(q.type) &&
    (S.only==='all' || (S.only==='wrong' && S.results[q.id] && S.results[q.id].s<1) || (S.only==='new' && !S.results[q.id]) || (S.only==='marked' && S.marked.includes(q.id))));
}
function shuffle(a,seed){ a=a.slice(); let r=seed||Math.random; for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rng(seed){ let x=seed>>>0||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000; }; }

/* ---------- question card ---------- */
// mode: 'practice' (immediate feedback), 'exam' (deferred), 'review' (everything shown)
function card(q, mode, n){
  const marked = S.marked.includes(q.id);
  let h = `<article class="qcard" data-id="${esc(q.id)}">
   <div class="qhead">${n?`<span class="tag">שאלה ${n}</span>`:''}<span class="tag exam" title="${esc(q.examLabel)}, ${esc(q.date)}">${esc(q.exam)} · שאלה ${esc(q.num)}</span>
   <span class="tag">${esc(TNAME[q.topic])}${q.sub?' · '+renderText(q.sub):''}</span><span class="tag type">${TYPENAME[q.type]}</span>
   <button class="star" data-act="mark" aria-pressed="${marked}" aria-label="סימון השאלה" title="סימון לחזרה">★</button></div>`;
  h += rich(q.intro) + rich(q.q) + code(q.code) + table(q.table);
  if(q.image) h += `<details class="orig" open><summary>כפי שמופיע בטופס המבחן</summary><img src="${esc(q.image)}" alt="הטבלה מטופס המבחן המקורי" loading="lazy"></details>`;
  if(q.type==='mcq'){
    const order = optOrder(q, mode);
    h += '<div class="opts">'+order.map((oi,k)=>`<button class="opt" data-act="mcq" data-oi="${oi}"><span class="k">${LETTERS[k]}.</span><span>${renderText(q.options[oi])}</span></button>`).join('')+'</div>';
    h += '<div class="slot"></div>';
  } else if(q.type==='tf'){
    h += `<div class="tf"><button class="opt" data-act="tf" data-v="1">נכון</button><button class="opt" data-act="tf" data-v="0">לא נכון</button></div><div class="slot"></div>`;
  } else {
    const parts = q.parts && q.parts.length ? q.parts : [{label:null,q:'',answer:q.answer}];
    parts.forEach((p,i)=>{
      h += `<div class="part" data-pi="${i}">${p.label?`<div class="plabel" dir="ltr">${esc(p.label)}</div>`:''}${rich(p.q)}${code(p.code)}${table(p.table)}
        <div class="bar">${mode==='review'?'':'<button class="btn ghost" data-act="reveal">הצג פתרון</button>'}</div><div class="slot"></div></div>`;
    });
    h += '<div class="slot final"></div>';
  }
  h += '</article>';

}
const ORD = {};
function optOrder(q, mode){
  if(mode==='review') return [0,1,2,3,4];
  if(ORD[q.id]) return ORD[q.id];
  const pin = q.options.map((o,i)=>i).filter(i=>/^כל התשובות/.test(q.options[i]));
  const free = q.options.map((o,i)=>i).filter(i=>!pin.includes(i));
  return ORD[q.id] = shuffle(free).concat(pin);
}
function solClosed(q, chosenOk){
  let h='<div class="sol">';
  if(chosenOk!==undefined) h+=`<div class="verdict ${chosenOk?'good':'bad'}">${chosenOk?'נכון!':'לא נכון.'}</div>`;
  const ans = q.type==='tf' ? (q.correct?'נכון':'לא נכון') : q.options[q.correct];
  h += `<div><h4>התשובה</h4>${rich(ans)}</div>`;
  h += common(q, true);
  return h+'</div>';
}
function common(q, withOfficial){
  let h='';
  if(q.expl) h+=`<div><h4>הסבר</h4>${rich(q.expl)}</div>`;
  if(q.note) h+=`<div class="note"><b>הערה על הפתרון הרשמי</b>${rich(q.note)}</div>`;
  if(withOfficial && q.official) h+=`<details class="off"><summary>הפתרון הרשמי של הקורס</summary>${rich(q.official)}</details>`;
  if(q.check) h+=`<div class="check">✓ ${renderText(q.check)}</div>`;
  if(TSTUDY[q.topic]) h+=`<div class="study">חומר רקע: <a href="${STUDY}${TPAGE[q.topic]||''}" target="_blank" rel="noopener">${esc(TSTUDY[q.topic])}</a> באתר הלמידה</div>`;
  return h;
}
function treeSVG(t){
  const CW=7.6, H=28, HS=42, VG=62, HG=14;
  const nodes=[];
  function meas(n,d){ const [l,sub,ch]=n; const w=Math.max(46, Math.max(String(l).length*CW, String(sub).length*6.4)+18);
    const o={l,sub,w,h:sub?HS:H,d,ch:ch.map(c=>meas(c,d+1))};
    o.sw=Math.max(o.w, o.ch.reduce((a,c)=>a+c.sw,0)+HG*Math.max(0,o.ch.length-1)); return o; }
  function place(o,x0){ if(!o.ch.length){ o.x=x0+o.sw/2; } else { let x=x0+(o.sw-(o.ch.reduce((a,c)=>a+c.sw,0)+HG*(o.ch.length-1)))/2;
      for(const c of o.ch){ place(c,x); x+=c.sw+HG; } o.x=(o.ch[0].x+o.ch[o.ch.length-1].x)/2; }
    o.y=8+o.d*(HS+VG); nodes.push(o); }
  const r=meas(t,0); place(r,8);
  const W=r.sw+16, Hh=Math.max(...nodes.map(n=>n.y+n.h))+8;
  let g='';
  for(const n of nodes) for(const c of n.ch) g+=`<path d="M${n.x} ${n.y+n.h} C${n.x} ${n.y+n.h+VG/2} ${c.x} ${c.y-VG/2} ${c.x} ${c.y}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  for(const n of nodes){ const x=n.x-n.w/2;
    g+=`<rect x="${x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="${n.d?'var(--surface)':'var(--accent-soft)'}" stroke="var(--accent)" stroke-width="1.5"/>`;
    g+=`<text x="${n.x}" y="${n.y+18}" text-anchor="middle" ${HEB.test(n.l)?'direction="rtl" font-family="var(--f-body)"':'font-family="var(--f-mono)"'} font-size="13" font-weight="600" fill="var(--ink)">${escapeHtml(String(n.l))}</text>`;
    if(n.sub) g+=`<text x="${n.x}" y="${n.y+34}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" fill="var(--ink-2)">${escapeHtml(String(n.sub))}</text>`; }
  return `<div class="tree"><svg dir="ltr" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="עץ תהליכים">${g}</svg></div>`;
}
function richT(text, tree){
  if(!tree || !String(text).includes('[[TREE]]')) return rich(text);
  return String(text).split('[[TREE]]').map(rich).join(treeSVG(tree));
}
function partSol(q, pi, grading){
  const parts = q.parts && q.parts.length ? q.parts : [{answer:q.answer}];
  let h = `<div class="sol"><div><h4>פתרון</h4>${richT(parts[pi].answer, parts[pi].tree)}${table(parts[pi].atable)}</div>`;
  if(grading) h += `<div class="grade" data-pi="${pi}">איך הלך? <button class="chip g1" data-act="grade" data-g="1">ידעתי</button><button class="chip gh" data-act="grade" data-g="0.5">חלקית</button><button class="chip g0" data-act="grade" data-g="0">לא ידעתי</button></div>`;
  return h+'</div>';
}
function finishOpen(art, q){
  const fin = art.querySelector('.slot.final');

}
function openScore(art){
  const gs = [...art.querySelectorAll('.grade')].map(g=>{ const b=g.querySelector('[aria-pressed="true"]'); return b?+b.dataset.g:null; });
  if(!gs.length || gs.some(x=>x===null)) return null;
  return gs.reduce((a,b)=>a+b,0)/gs.length;
}

let EXAM = null; // {qs, submitted, end, timer}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const art = b.closest('.qcard'); const q = art ? QID[art.dataset.id] : null;
  const act = b.dataset.act;
  const inExam = !!(EXAM && art && art.closest('#examlist'));
  if(act==='mark'){ const i=S.marked.indexOf(q.id); if(i<0) S.marked.push(q.id); else S.marked.splice(i,1); b.setAttribute('aria-pressed', i<0); save(); return; }
  if(act==='mcq' || act==='tf'){
    if(inExam){ if(EXAM.submitted) return; art.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); b.classList.add('sel'); return; }
    if(art.dataset.done) return; art.dataset.done='1';
    const ok = act==='mcq' ? (+b.dataset.oi===q.correct) : ((b.dataset.v==='1')===q.correct);
    markClosed(art,q,b,ok); record(q.id, ok?1:0); return;
  }
  if(act==='reveal'){
    if(inExam && !EXAM.submitted) return;
    const part=b.closest('.part'); part.querySelector('.slot').innerHTML = partSol(q, +part.dataset.pi, true); b.remove(); return;
  }
  if(act==='grade'){
    b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true');
    const sc = openScore(art);
    if(sc!==null){ finishOpen(art,q); record(q.id, sc); if(inExam) updateExamScore(); }
    return;
  }
  if(HANDLERS[act]) HANDLERS[act](b,e);
});
function markClosed(art,q,chosenBtn,ok){

HANDLERS.startreal = ()=>{ const c=document.getElementById('exsel').value; startExam(Q.filter(q=>q.exam===c), 'מבחן '+c+' · '+B.exams.find(e=>e.code===c).label); };

function startExam(qs,title){

function maxPts(q){ return q.type==='open'?25:5; }
function examRun(){
  let h = `<div class="exhead"><h1>${esc(EXAM.title)}</h1><span class="timer" id="timer"></span></div>`;
  h += '<div class="list" id="examlist">'+EXAM.qs.map((id,i)=>card(QID[id],'exam',i+1)).join('')+'</div>';
  h += `<div class="bar" id="exfoot">${EXAM.submitted?'':'<button class="btn" data-act="submit">הגשה</button>'}<button class="btn ghost" data-act="quit">יציאה מהמבחן</button><span id="exscore"></span></div>`;
  return h;
}
HANDLERS.submit = ()=>submitExam();
HANDLERS.quit = ()=>{ EXAM=null; render(true); };
function submitExam(){
  if(!EXAM || EXAM.submitted) return; EXAM.submitted = true;
  document.querySelectorAll('#examlist .qcard').forEach(art=>{
    const q=QID[art.dataset.id];
    if(q.type==='open') return;
    const sel = art.querySelector('.opt.sel');
    const ok = sel ? (q.type==='mcq' ? +sel.dataset.oi===q.correct : (sel.dataset.v==='1')===q.correct) : false;
    markClosed(art,q,sel,ok); art.dataset.ok = ok?1:0; record(q.id, ok?1:0);
  });
  const sb=document.querySelector('[data-act="submit"]'); if(sb) sb.remove();
  updateExamScore();
  document.getElementById('examlist').scrollIntoView({behavior:'smooth'});
}
function updateExamScore(){
  if(!EXAM || !EXAM.submitted) return;
  let got=0, max=0, pending=0;
  document.querySelectorAll('#examlist .qcard').forEach(art=>{
    const q=QID[art.dataset.id]; max+=maxPts(q);
    if(q.type==='open'){ const s=openScore(art); if(s===null) pending++; else got+=25*s; } else got+= art.dataset.ok==='1'?5:0;
  });
  const pct = Math.round(100*got/max);
  document.getElementById('exscore').innerHTML = `<span class="score">${pct}</span> / 100 ` + (pending?`<span class="pnum">(חסר דירוג עצמי ב-${pending} שאלות פתוחות – לחצו "הצג פתרון" בכל סעיף)</span>`:'');
}
function tick(){
  clearInterval(window.__t);
  window.__t = setInterval(()=>{
    const el=document.getElementById('timer'); if(!EXAM){clearInterval(window.__t);return;}
    if(!EXAM.end || EXAM.submitted){ if(el) el.textContent=''; return; }
    const left = Math.max(0, EXAM.end-Date.now());
    const m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
    if(el) el.textContent = `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(left===0) submitExam();
  },1000);
}

/* ---------- progress ---------- */
function progress(){
  let h = '<h1>התקדמות</h1><p class="lede">התוצאה האחרונה בכל שאלה שניסיתם, לפי נושא. שאלה פתוחה נחשבת לפי הדירוג העצמי שלה. הנתונים נשמרים רק בדפדפן הזה.</p><div class="panel prog">';

    h+=`<div class="prow"><span>${esc(name)}</span><span class="track" aria-hidden="true"><i class="g" style="width:${g}%"></i><i class="b" style="width:${bd}%"></i></span><span class="pnum">${tried.length}/${qs.length} · ${tried.length?Math.round(100*good/tried.length)+'%':'–'}</span></div>`;
  }
  h+='</div>';
  const wrong = Q.filter(q=>S.results[q.id] && S.results[q.id].s<1).sort((a,b)=>S.results[b.id].t-S.results[a.id].t);
  h+='<h2 style="margin-top:22px">טעויות אחרונות</h2>';
  h+= wrong.length ? '<div class="panel mini" style="margin-top:8px">'+wrong.slice(0,40).map(q=>`<button class="chip" data-act="goto" data-id="${esc(q.id)}" title="${esc(TNAME[q.topic])}">${esc(q.id)}</button>`).join('')+'</div>' : '<p class="lede">אין עדיין טעויות רשומות.</p>';
  const mk=S.marked.filter(id=>QID[id]);
  h+='<h2 style="margin-top:22px">מסומנות ★</h2>'+(mk.length?'<div class="panel mini" style="margin-top:8px">'+mk.map(id=>`<button class="chip" data-act="goto" data-id="${esc(id)}">${esc(id)}</button>`).join('')+'</div>':'<p class="lede">עוד לא סימנתם שאלות.</p>');
  h+='<div class="bar" id="resetbar" style="margin-top:22px"><button class="btn ghost" data-act="reset">איפוס ההתקדמות</button></div>';
  return h;
}
HANDLERS.reset = ()=>{ document.getElementById('resetbar').innerHTML='<span class="confirm">למחוק את כל התוצאות והסימונים? <button class="btn" data-act="resetyes">מחיקה</button><button class="btn ghost" data-act="resetno">ביטול</button></span>'; };
HANDLERS.resetyes = ()=>{ S.results={}; S.marked=[]; save(); render(); };
HANDLERS.resetno = ()=>render();

/* ---------- router ---------- */
const VIEWS = {practice, exam:examView, browse, progress};
function render(top){
  let v = location.hash.slice(1); if(!VIEWS[v]) v='practice';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.view===v?'page':'false'));
  const app=document.getElementById('app'); app.innerHTML = VIEWS[v]();
  if(v==='browse'){ fillBrowse(); const s=document.getElementById('bq'); s.addEventListener('input',()=>{ QUERY=s.value; clearTimeout(window.__bt); window.__bt=setTimeout(fillBrowse,200); }); }
  if(v==='exam' && EXAM){ updateExamScore(); }
  if(top) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>render(true));
render();
</script>
