<script>
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderText(text) {
  if (!text) return '';

  // Normalize inline numbered lists written with parenthesized markers
  // "(1) x (2) y (3) z" or "(1) x, (2) y" mid-sentence: these render badly in
  // RTL (each "(N)" splits and the items reorder visually). If the text has a
  // "(1)" marker followed later by "(2)", put items 2+ on their own line. The
  // "(1)" item stays in place; a blank line before "(1)" is left to the author.
  if (/\(1\)\s/.test(text) && /\(2\)\s/.test(text)) {
    text = text.replace(/[,;]?\s+(\([2-9]\))\s/g, '\n$1 ');
  }

  // We wrap LTR runs (English / numbers / math) in <span class="ltr"> BEFORE
  // escaping, so comparison operators like > and < can live inside a run
  // (e.g. "68 > 63") without the escaped entity (&gt;) being torn apart by the
  // matcher. Each matched run is HTML-escaped inside the replacement; the
  // Hebrew text between runs is escaped separately afterwards.
  const inner = "[A-Za-z0-9_<>\\-+=:;/\\\\.,()\\[\\]{}@#$%^&*'\"`~?!|\u00B7\u00B1\u00D7\u00F7\u00B0\u2030\u0370-\u03FF\u2070-\u209F\u2200-\u22FF\u2190-\u21FF]";
  const start = "[A-Za-z0-9\u0370-\u03FF]";
  const piece = `${start}${inner}*`;
  // A piece bridged across a MATH-OPERATOR gap (e.g. "= (1-β)") may begin with an
  // opening bracket or |, so a formula like
  // "DevRTT = (1-β)·DevRTT + β·|SampleRTT - EstimatedRTT|" stays one LTR run.
  const mathPiece = `[\\(\\[\\{|]?${start}${inner}*|[\\(\\[\\{|]${inner}*`;
  // A piece bridged across a PLAIN SPACE must start with an alphanumeric — this
  // prevents "LAN1 (מארחים...)" from pulling the "(" into the LAN1 run (which
  // then orphans the paren when the Hebrew word breaks the run).
  const plainPiece = piece;
  const mathGap = `[ ]+[=+\\-*/×÷·|<>&\u00B1][ ]+`;
  const spaceGap = `[ ]+`;
  const re = new RegExp(`(${piece}(?:(?:${mathGap}(?:${mathPiece}))|(?:${spaceGap}(?:${plainPiece})))*)`, 'g');

  const PLACEHOLDER = '\u0000';
  const runs = [];
  // Replace each LTR run with a placeholder, remembering its escaped HTML.
  text = text.replace(re, m => {
    // Move trailing punctuation that belongs to the RTL sentence outside the
    // span: sentence-enders (? ! .) and also , : ; — a run ends at an LTR→RTL
    // boundary, so a comma/colon there is the Hebrew sentence's, not the term's
    // (fixes "IPv4," rendering the comma on the wrong side). We keep at most the
    // trailing punctuation run; internal commas (f(x,y), 1,000) are untouched
    // because they're not at the run's end.
    const trailing = m.match(/[?!.,:;]+$/);
    let core = m, tail = '';
    if (trailing) {
      const ltrPart = m.slice(0, m.length - trailing[0].length);
      if (ltrPart && /[A-Za-z0-9\u0370-\u03FF]/.test(ltrPart)) {
        core = ltrPart;
        tail = trailing[0];
      }
    }
    // Don't LTR-wrap a standalone number that sits in Hebrew context (e.g. the
    // "5" in "(5 שכבות)", "4" in "שכבה 4", a year "2023", or "1,000"). Isolating
    // such a number in its own span makes it read awkwardly next to the Hebrew.
    // We DO still wrap numbers that carry LTR structure: IP addresses / version
    // numbers (two or more dot/colon-separated groups), math operators
    // (= < > / * + - · | %), a caret power, or an attached unit letter — those
    // genuinely need left-to-right isolation.
    const isBareNumber = /^[0-9]+(?:[.,][0-9]+)?$/.test(core);
    if (isBareNumber) {
      runs.push(escapeHtml(core) + escapeHtml(tail));
      return PLACEHOLDER + (runs.length - 1) + PLACEHOLDER;
    }
    const pairs = { ')': '(', ']': '[', '}': '{' };
    let moved = '';
    let guard = 0;
    while (guard++ < 8) {
      const last = core[core.length - 1];
      if (pairs[last]) {
        const opener = pairs[last];
        const opens = (core.match(new RegExp('\\' + opener, 'g')) || []).length;
        const closes = (core.match(new RegExp('\\' + last, 'g')) || []).length;
        if (closes > opens) { moved = escapeHtml(last) + moved; core = core.slice(0, -1); continue; }
      }
      break;
    }
    runs.push(`<span class="ltr">${escapeHtml(core)}</span>${moved}${escapeHtml(tail)}`);
    return PLACEHOLDER + (runs.length - 1) + PLACEHOLDER;
  });

  // Escape the Hebrew/other text that sits between the runs.
  text = escapeHtml(text);

  // Restore the runs.
  text = text.replace(new RegExp(PLACEHOLDER + '(\\d+)' + PLACEHOLDER, 'g'), (_, i) => runs[+i]);

  // Bidi anchor: an opening bracket that sits between a closing LTR </span> and
  // Hebrew text (e.g. "Playback Attack (התקפת השמעה חוזרת)") is a bidi-neutral
  // character; the browser may resolve its direction toward the LTR side and
  // render it on the wrong edge. Insert a Right-to-Left Mark (U+200F) before
  // such a bracket so it anchors to the surrounding RTL context. We only touch
  // brackets that are OUTSIDE spans (a run's own "(" is already inside the span).
  text = text.replace(/(<\/span>)(\s*)([(\[{])(\s*[\u0590-\u05FF])/g, '$1$2\u200F$3$4');

  // Auto-break inline numbered lists: a marker like "2)" or "3)" that follows
  // ", " or "; " starts a new line, so "1) ... , 2) ... , 3) ..." stacks
  // vertically instead of running together (which reads badly in RTL). The
  // first item ("1)") is left in place; we only break BEFORE items 2 and on.
  // We require the "N)" to be followed by a space so "(שכבה 4)" is never hit.
  if (/(?:^|[\s>])1\)\s/.test(text)) {
    text = text.replace(/(?:,|;)\s+([2-9]\))\s/g, '\n$1 ');
  }

  // line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

const HEB = /[֐-׿]/;

function rich(text){
  if(!text) return '';

  for(const block of String(text).split(/\n{2,}/)){
    const lines = block.split('\n');
    const nCode = lines.filter(isCode).length;
    if(lines.length>=2 && nCode>=Math.ceil(lines.length/2) && lines.every(l=>!HEB.test(l) || /\/\//.test(l))){
      out.push('<pre class="code">'+escapeHtml(block)+'</pre>'); continue;
    }
    out.push(lines.map(l=> l.trim()==='' ? '' : HEB.test(l) ? '<div class="ln">'+renderText(l)+'</div>' : '<div class="ln m" dir="ltr">'+escapeHtml(l)+'</div>').join(''));
  }

}

// mode: 'practice' (immediate feedback), 'exam' (deferred), 'review' (everything shown)
function card(q, mode, n){

  } else {

      h += `<div class="part" data-pi="${i}">${p.label?`<div class="plabel" dir="ltr">${esc(p.label)}</div>`:''}${rich(p.q)}${code(p.code)}${table(p.table)}
        ${mode==='review'?'':`<label class="myans"><span>התשובה שלי${mode==='exam'?'':' (נשמרת במכשיר הזה)'}</span><textarea dir="auto" rows="3" data-pi="${i}" data-save="${mode==='exam'?0:1}" placeholder="כתבו כאן את התשובה, ואז השוו לפתרון">${mode==='exam'?'':esc(myAns(q.id,i))}</textarea></label>`}
        <div class="bar">${mode==='review'?'':'<button class="btn ghost" data-act="reveal">הצג פתרון</button>'}</div><div class="slot"></div></div>`;

const ORD = {};
function optOrder(q, mode){
  if(mode==='review') return [0,1,2,3,4];
  if(ORD[q.id]) return ORD[q.id];
  const pin = q.options.map((o,i)=>i).filter(i=>/^כל התשובות/.test(q.options[i]));
  const free = q.options.map((o,i)=>i).filter(i=>!pin.includes(i));
  return ORD[q.id] = shuffle(free).concat(pin);
}
function solClosed(q, chosenOk){
  let h='<div class="sol">';
  if(chosenOk!==undefined) h+=`<div class="verdict ${chosenOk?'good':'bad'}">${chosenOk?'נכון!':'לא נכון.'}</div>`;

}
function common(q, withOfficial){
  let h='';
  if(q.expl) h+=`<div><h4>הסבר</h4>${rich(q.expl)}</div>`;
  if(q.note) h+=`<div class="note"><b>הערה על הפתרון הרשמי</b>${rich(q.note)}</div>`;

  return h;
}
function treeSVG(t){
  const CW=7.6, H=28, HS=42, VG=62, HG=14;
  const nodes=[];
  function meas(n,d){ const [l,sub,ch]=n; const w=Math.max(46, Math.max(String(l).length*CW, String(sub).length*6.4)+18);
    const o={l,sub,w,h:sub?HS:H,d,ch:ch.map(c=>meas(c,d+1))};
    o.sw=Math.max(o.w, o.ch.reduce((a,c)=>a+c.sw,0)+HG*Math.max(0,o.ch.length-1)); return o; }
  function place(o,x0){ if(!o.ch.length){ o.x=x0+o.sw/2; } else { let x=x0+(o.sw-(o.ch.reduce((a,c)=>a+c.sw,0)+HG*(o.ch.length-1)))/2;
      for(const c of o.ch){ place(c,x); x+=c.sw+HG; } o.x=(o.ch[0].x+o.ch[o.ch.length-1].x)/2; }
    o.y=8+o.d*(HS+VG); nodes.push(o); }
  const r=meas(t,0); place(r,8);
  const W=r.sw+16, Hh=Math.max(...nodes.map(n=>n.y+n.h))+8;
  let g='';
  for(const n of nodes) for(const c of n.ch) g+=`<path d="M${n.x} ${n.y+n.h} C${n.x} ${n.y+n.h+VG/2} ${c.x} ${c.y-VG/2} ${c.x} ${c.y}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  for(const n of nodes){ const x=n.x-n.w/2;
    g+=`<rect x="${x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="${n.d?'var(--surface)':'var(--accent-soft)'}" stroke="var(--accent)" stroke-width="1.5"/>`;
    g+=`<text x="${n.x}" y="${n.y+18}" text-anchor="middle" ${HEB.test(n.l)?'direction="rtl" font-family="var(--f-body)"':'font-family="var(--f-mono)"'} font-size="13" font-weight="600" fill="var(--ink)">${escapeHtml(String(n.l))}</text>`;
    if(n.sub) g+=`<text x="${n.x}" y="${n.y+34}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" fill="var(--ink-2)">${escapeHtml(String(n.sub))}</text>`; }
  return `<div class="tree"><svg dir="ltr" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="עץ תהליכים">${g}</svg></div>`;
}
function richT(text, tree){
  if(!tree || !String(text).includes('[[TREE]]')) return rich(text);
  return String(text).split('[[TREE]]').map(rich).join(treeSVG(tree));
}
function partSol(q, pi, grading){

}

}

const HANDLERS = {};

/* ---------- report a problem / ask the lecturer ---------- */
function tableText(t){ return t ? [t.headers.join(' | ')].concat(t.rows.map(r=>r.join(' | '))).join('\n') : ''; }
function treeText(n){
  const out=[]; const lab=x=>x[0]+(x[1]?'  ('+x[1]+')':'');
  out.push(lab(n));
  (function walk(ch,pre){ ch.forEach((c,i)=>{ const last=i===ch.length-1; out.push(pre+(last?'└── ':'├── ')+lab(c)); walk(c[2], pre+(last?'    ':'│   ')); }); })(n[2],'');
  return out.join('\n');
}
function clean(t,tree){ return String(t||'').replace(/\[\[TREE\]\]/g, tree ? treeText(tree) : '').trim(); }
function qText(q, withSol){
  const out=[]; const add=t=>{ t=clean(t); if(t) out.push(t); }; const addc=t=>{ t=String(t||'').replace(/^\n+|\s+$/g,''); if(t) out.push(t); };
  add(q.intro); add(q.q); addc(q.code); add(tableText(q.table));
  if(q.type==='tf') add('(נכון / לא נכון)');
  if(q.type==='mcq') add(q.options.map(o=>'• '+o).join('\n'));
  (q.parts||[]).forEach(p=>{ add((p.label?p.label+'. ':'')+(p.q||'')); addc(p.code); add(tableText(p.table)); });
  if(withSol){
    let sol = q.type==='mcq' ? 'התשובה הנכונה: '+q.options[q.correct] : q.type==='tf' ? 'התשובה: '+(q.correct?'נכון':'לא נכון') :
      (q.parts&&q.parts.length ? q.parts.map(p=>(p.label?p.label+'. ':'')+clean(p.answer,p.tree)+(p.atable?'\n'+tableText(p.atable):'')).join('\n\n') : clean(q.answer));
    out.push(sol);

/* ---------- practice ---------- */
let ORDER = null;
function osig(){ return JSON.stringify([S.topics.slice().sort(),S.types.slice().sort(),S.only]); }
function practice(){
  const list = filtered(), sig = osig();
  // the order is frozen for a filter setting: answering a question (which changes "new"/"wrong") never reshuffles or skips
  if(!ORDER && S.order && S.osig===sig && S.order.every(id=>QID[id])) ORDER = S.order;
  if(!ORDER || !ORDER.every(id=>QID[id])){ ORDER = shuffle(list.map(q=>q.id)); S.pos=0; }
  if(S.order!==ORDER || S.osig!==sig){ S.order=ORDER; S.osig=sig; save(); }
  const per = S.per||ORDER.length||1;
  if(S.pos>=ORDER.length) S.pos=0;
  S.pos = Math.floor(S.pos/per)*per;
  let h = '<h1>תרגול</h1><p class="lede">שאלות מכל המבחנים, בסדר אקראי. בשאלות סגורות התשובה נבדקת מיד; בשאלות פתוחות חושפים את הפתרון לכל סעיף ומדרגים את עצמכם.</p>';

  if(!ORDER.length) return h+'<div class="panel empty">אין שאלות שמתאימות לסינון. הוסיפו נושא או סוג שאלה.</div>';
  const end = Math.min(S.pos+per, ORDER.length);
  const bar = (bottom)=>`<div class="bar"><span class="count">${per===1?S.pos+1:(S.pos+1)+'–'+end} / ${ORDER.length}</span>
    <button class="btn ghost" data-act="prev" ${S.pos===0?'disabled':''}>${per===1?'הקודמת':'העמוד הקודם'}</button>
    ${bottom?'':'<button class="btn ghost" data-act="reshuffle">ערבוב</button>'}
    <button class="btn" data-act="next">${per===1?'הבאה':'העמוד הבא'}</button></div>`;
  h += `<div class="frow perrow"><span class="flabel">בכל עמוד</span>${[1,5,10,20,0].map(n=>`<button class="chip" data-act="per" data-v="${n}" aria-pressed="${(S.per||0)===n}">${n||'הכל'}</button>`).join('')}</div>`;
  h += bar(false);
  h += '<div class="list">'+ORDER.slice(S.pos,end).map((id,i)=>card(QID[id],'practice',per===1?0:S.pos+i+1)).join('')+'</div>';
  if(end-S.pos>1) h += bar(true);
  return h;
}

  },1000);
}

function progress(){

  }

  h+= wrong.length ? '<div class="panel mini" style="margin-top:8px">'+wrong.slice(0,40).map(q=>`<button class="chip" data-act="goto" data-id="${esc(q.id)}" title="${esc(TNAME[q.topic])}">${esc(q.id)}</button>`).join('')+'</div>' : '<p class="lede">אין עדיין טעויות רשומות.</p>';
  const mk=S.marked.filter(id=>QID[id]);
  h+='<h2 style="margin-top:22px">מסומנות ★</h2>'+(mk.length?'<div class="panel mini" style="margin-top:8px">'+mk.map(id=>`<button class="chip" data-act="goto" data-id="${esc(id)}">${esc(id)}</button>`).join('')+'</div>':'<p class="lede">עוד לא סימנתם שאלות.</p>');
  h+='<div class="bar" id="resetbar" style="margin-top:22px"><button class="btn ghost" data-act="reset">איפוס ההתקדמות</button></div>';
  return h;
}
HANDLERS.reset = ()=>{ document.getElementById('resetbar').innerHTML='<span class="confirm">למחוק את כל התוצאות והסימונים? <button class="btn" data-act="resetyes">מחיקה</button><button class="btn ghost" data-act="resetno">ביטול</button></span>'; };
HANDLERS.resetyes = ()=>{ S.results={}; S.marked=[]; save(); render(); };
HANDLERS.resetno = ()=>render();

/* ---------- router ---------- */
function home(){
  const nOpen=Q.filter(q=>q.type==='open').length, years=B.exams.map(e=>+e.date.slice(-4)).filter(Boolean);
  const nRep=Q.filter(q=>q.rep).length;
  let h='<div class="home"><header class="hero"><div class="hero-meta"><span>המכללה האקדמית תל אביב-יפו · בית הספר למדעי המחשב</span></div>';
  h+='<h1>מערכות הפעלה</h1><p>תרגול אינטראקטיבי למבחן · מבוסס על מבחנים אמיתיים משנים <span class="ltr">'+Math.min(...years)+'</span>–<span class="ltr">'+Math.max(...years)+'</span>, עם פתרון מלא ומנומק לכל שאלה</p>';
  h+='<div class="hstats">'+[[Q.length,'שאלות'],[B.exams.length,'מבחנים'],[nOpen,'שאלות פתוחות'],[nRep,'חזרו במבחנים']].map(x=>`<div class="hstat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div></header>';
  // weak topics
  const per={}; Object.entries(S.results).forEach(([id,r])=>{ const q=QID[id]; if(!q) return; const t=per[q.topic]=per[q.topic]||{n:0,s:0}; t.n++; t.s+=r.s; });
  const weak=Object.entries(per).filter(([t,v])=>v.n>=3 && v.s/v.n<0.75).sort((a,b)=>a[1].s/a[1].n-b[1].s/b[1].n).slice(0,4);
  if(weak.length) h+=`<section class="weak"><h2>◐ כדאי לחזור על</h2><div style="font-size:.85rem;color:var(--ink-2)">הנושאים שבהם ההצלחה שלכם הכי נמוכה עד עכשיו</div><div class="wl">${weak.map(([t,v])=>`<button class="wi tbadge t-${t}" data-act="topicgo" data-v="${t}"><b>${esc(TNAME[t])}</b><small>${Math.round(100*v.s/v.n)}% הצלחה · ${v.n} שאלות</small><div class="bar2"><i style="width:${Math.round(100*v.s/v.n)}%"></i></div></button>`).join('')}</div></section>`;
  const modes=[
    ['practice','t-process','◉','תרגול לפי נושא','שאלה אחר שאלה או כמה בעמוד, לפי נושא וסוג. בלי לחץ זמן, עם פתרון מלא אחרי כל שאלה.','לבחור נושא ←','#practice'],
    ['exam','t-threads','⏱','סימולציית מבחן','מבחן מקורי מלא או מבחן אקראי (5 סגורות ו-3 פתוחות), עם טיימר וציון בסוף.','להתחיל מבחן ←','#exam'],
    ['browse','t-redir','≡','גלישה במאגר','כל השאלות לפי מבחן, עם הפתרונות המלאים וחיפוש חופשי. שימושי לחזרה לפני המבחן.','לסקור שאלות ←','#browse'],
    ['wrong','t-sched','★','טעויות ומסומנות','שאלות שטעיתם בהן ושאלות שסימנתם לחזרה – תרגול ממוקד במה שעוד לא יושב.','לתרגל טעויות ←',null],
    ['progress','t-sync','▤','התקדמות','כמה פתרתם בכל נושא, ומה אחוז ההצלחה שלכם.','לראות התקדמות ←','#progress'],
    ['study','t-memory','📖','אתר הסיכום','סיכום מלא של ההרצאות והתרגולים, עם הדגמות אינטראקטיביות – להעמקה לפני התרגול.','לאתר הסיכום ↗',STUDY]];
  h+='<section><h2 class="stitle">בחרו מצב תרגול</h2><div class="modes">'+modes.map(m=>{
    const inner=`<div class="ic">${m[2]}</div><h3>${m[3]}</h3><p>${m[4]}</p><span class="cta">${m[5]}</span>`;
    return m[6] ? `<a class="mode ${m[1]}" href="${m[6]}"${m[0]==='study'?' target="_blank" rel="noopener"':''}>${inner}</a>` : `<button class="mode ${m[1]}" data-act="wronggo">${inner}</button>`; }).join('')+'</div></section>';
  const DET={intro:'מבנה מערכת · מצבי מעבד · קריאות מערכת',process:'fork · exec · wait · PCB',sched:'FIFO · SJF · RR · MLFQ · Lottery',signals:'סיגנלים · זומבים · יתומים',redir:'exec · dup2 · pipe · הפניות',memory:'Paging · TLB · טבלה היררכית · החלפת דפים',
    threads:'חוטים · מרוצים · מנעולים',sync:'סמפורים · משתני תנאי · מחסומים',deadlock:'קיפאון · הרעבה · מניעה',disk:'זמני גישה · RAID · SSD',fs:'VSFS · inode · מצביעים · קישורים'};
  h+='<section><h2 class="stitle">נושאי הקורס</h2><div class="tgrid">'+TOPICS.map(t=>`<button class="tbadge t-${t[0]}${t[2]?'':' later'}" data-act="topicgo" data-v="${t[0]}" title="תרגול הנושא"><b>${esc(t[1])} <small style="font-weight:400;color:var(--muted)">· ${Q.filter(q=>q.topic===t[0]).length}</small></b><span>${DET[t[0]]}${t[2]?'':' · עוד לא נלמד'}</span></button>`).join('')+'</div></section>';
  h+='<section><h2 class="stitle">מבנה המבחן</h2><div class="igrid">'+[['שאלות סגורות','5 שאלות'],['ניקוד לסגורה','5 נקודות'],['שאלות פתוחות','3 שאלות'],['ניקוד לפתוחה','25 נקודות'],['סוגי שאלות','אמריקאיות, נכון/לא נכון, פתוחות']].map(x=>`<div class="icard"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')+
    '</div><p style="font-size:.82rem;color:var(--muted);margin:8px 0 0">זה המבנה ב-18 מתוך 31 המבחנים במאגר. בחלק מהמבחנים יש 4–5 שאלות פתוחות, ובמבחנים הישנים אין שאלות סגורות.</p></section>';
  const done=Object.keys(S.results).filter(id=>QID[id]).length;
  h+=`<footer class="hfoot">האתר נבנה על בסיס ${B.exams.length} מבחנים אמיתיים של הקורס. כל פתרון נבדק – רבים מהם בהרצת קוד או בחישוב.<br>${done?`פתרתם עד עכשיו ${done} שאלות.`:'כל ההתקדמות נשמרת במכשיר שלכם בלבד.'}</footer></div>`;
  return h;
}
HANDLERS.topicgo = b=>{ S.topics=[b.dataset.v]; S.types=TYPES.map(t=>t[0]); S.only='all'; S.pos=0; ORDER=null; save(); location.hash='practice'; };
HANDLERS.wronggo = ()=>{ S.topics=TOPICS.map(t=>t[0]); S.types=TYPES.map(t=>t[0]); S.only='review'; S.pos=0; ORDER=null; save(); location.hash='practice'; };
var CURVIEW = 'home';
document.getElementById('studylink').href = STUDY;
const VIEWS = {home, practice, exam:examView, browse, progress};
function render(top){
  let v = location.hash.slice(1);
  if(v.startsWith('t=')){ const t=decodeURIComponent(v.slice(2)); history.replaceState(null,'','#practice');
    if(TNAME[t]){ S.topics=[t]; S.types=TYPES.map(x=>x[0]); S.only='all'; S.pos=0; ORDER=null; S.order=null; save(); } v='practice'; }
  if(v.startsWith('q=')){ const id=decodeURIComponent(v.slice(2)); history.replaceState(null,'','#practice'); if(QID[id]) return openQ(id); v='practice'; }
  if(!v) v='home';
  if(!VIEWS[v]) v='practice';
  CURVIEW = v;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.view===v?'page':'false'));
  const app=document.getElementById('app'); app.innerHTML = VIEWS[v]();
  if(v==='browse'){ fillBrowse(); const s=document.getElementById('bq'); s.addEventListener('input',()=>{ QUERY=s.value; clearTimeout(window.__bt); window.__bt=setTimeout(fillBrowse,200); }); }
  if(v==='exam' && EXAM){ updateExamScore(); }
  app.querySelectorAll('.myans textarea').forEach(t=>{ if(t.value) grow(t); });
  if(top) window.scrollTo(0,0);
}

window.addEventListener('hashchange',()=>{
  const to = location.hash.slice(1)||'home';
  if(CURVIEW==='exam' && to!=='exam' && EXAM){
    if(examActive()){ history.replaceState(null,'','#exam'); askLeave(()=>{ location.hash=to; }); return; }
    EXAM=null; // a submitted exam is closed when leaving; the exam tab then opens the exam menu
  }
  CURVIEW = to; render(true);
});
render();
</script>
